name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and tests (PGlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:vercel
      - run: npm audit --audit-level=high

  postgres:
    # The same suite against a real server, proving the PGlite dialect and
    # Postgres behave alike.
    name: Tests (Postgres 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: snip_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/snip_test

  e2e:
    name: Browser tests (with and without JavaScript)
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.55.1-noble
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright test
        env:
          HOME: /root
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up -d --build --wait
      - name: Smoke test against Postgres
        run: |
          curl -fsS localhost:3000/healthz | grep '"persistent":true'
          slug=$(curl -fsS -X POST localhost:3000/api/links -H 'content-type: application/json' -d '{"url":"https://example.com"}' | sed -E 's/.*"slug":"([^"]+)".*/\1/')
          test "$(curl -s -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0 Chrome/141.0' localhost:3000/$slug)" = 302
      - if: failure()
        run: docker compose logs
